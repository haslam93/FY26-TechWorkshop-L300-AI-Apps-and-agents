name: Build and Deploy to Azure Container Registry

# This workflow builds a Docker image from the src/ folder and pushes it to ACR
# Required secrets:
#   - ENV: Contents of the .env file
#   - AZURE_CONTAINER_REGISTRY: ACR login server (e.g., myregistry.azurecr.io)
#   - AZURE_CLIENT_ID: Service Principal client ID
#   - AZURE_TENANT_ID: Service Principal tenant ID (for reference)
#   - AZURE_CLIENT_SECRET: Service Principal client secret

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: chat-app

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file from secret
        working-directory: ./src
        run: |
          printf '%s' "$ENV_CONTENT" > .env
        env:
          ENV_CONTENT: ${{ secrets.ENV }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Clean up .env file
        if: always()
        working-directory: ./src
        run: |
          if [ -f .env ]; then
            shred -f -u .env || rm -f .env
            echo ".env file securely removed"
          fi
